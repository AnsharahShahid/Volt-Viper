<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volt Viper</title>
<meta name="description" content="Volt Viper: a neon-style snake game. 1-2 players, wrap-around walls, power-ups and synthesized sound. Play it in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080a1a'/%3E%3Cpath d='M36 6 16 36h14l-4 22 22-32H34z' fill='%2300ffd2'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #05060f; color: #aab4d4;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 16px; gap: 14px;
    background: radial-gradient(ellipse at top, #12163a 0%, #05060f 70%); }
  #wrap { width: min(100%, 784px); }
  canvas { display: block; width: 100%; height: auto; border-radius: 14px; touch-action: none;
    box-shadow: 0 0 0 1px rgba(0,255,210,.25), 0 0 40px rgba(0,255,210,.12), 0 20px 60px rgba(0,0,0,.6);
    outline: none; background: #000; }
  footer { font-size: 13px; text-align: center; line-height: 1.6; max-width: 784px; }
  footer a { color: #00ffd2; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  kbd { background: #151a3a; border: 1px solid #2a3166; border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #dfe6ff; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="784" height="624" tabindex="0" aria-label="Volt Viper game"></canvas></div>
<footer>
  <div><kbd>Arrows</kbd>/<kbd>WASD</kbd> steer &nbsp; <kbd>Space</kbd> start/pause &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>Esc</kbd> menu &nbsp;&middot;&nbsp; Two players: P1 <kbd>WASD</kbd>, P2 <kbd>Arrows</kbd></div>
  <div>On a phone: swipe to steer, tap to start. &nbsp;&middot;&nbsp; <a href="https://github.com/AnsharahShahid/Volt-Viper" target="_blank" rel="noopener">Source on GitHub</a></div>
</footer>

<script>
"use strict";
// Volt Viper - HTML5 canvas port of the Java Swing game.

// ---------- constants ----------
const TILE = 28, COLS = 28, ROWS = 20, HUD = 64;
const FIELD_W = TILE * COLS, FIELD_H = TILE * ROWS;
const W = FIELD_W, H = FIELD_H + HUD;

const CYAN = [0, 255, 210], MAGENTA = [255, 60, 180], GOLD = [255, 210, 60], PURPLE = [170, 110, 255],
      BLUE = [90, 170, 255], RED = [255, 70, 110], ORANGE = [255, 150, 40], WHITE = [255, 255, 255];

const DIFFS = [
  { name: "EASY",   base: 0.17,  step: 0.006, min: 0.085, obstacleFactor: 0.6 },
  { name: "NORMAL", base: 0.14,  step: 0.009, min: 0.055, obstacleFactor: 1.0 },
  { name: "HARD",   base: 0.115, step: 0.011, min: 0.042, obstacleFactor: 1.6 },
];

const FONT = 'system-ui, "Segoe UI", Roboto, Arial, sans-serif';
const font = (px, bold) => (bold ? "bold " : "") + px + "px " + FONT;

// ---------- colour helpers (alpha is 0-255 like the Java version) ----------
const A = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (Math.max(0, Math.min(255, a)) / 255).toFixed(3) + ")";
const rgb = c => "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
const brighter = c => c.map(v => Math.min(255, Math.floor(v / 0.7)));
const darker = c => c.map(v => Math.floor(v * 0.7));
function hsb(h, s, v) {
  h = h - Math.floor(h);
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
  const m = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  return m.map(x => Math.round(x * 255));
}

// ---------- sound (Web Audio) ----------
const Sound = {
  enabled: true, ctx: null,
  unlock() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  // notes = pairs of (frequencyHz, durationMs); frequency 0 = rest
  play(...notes) {
    if (!this.enabled || !this.ctx) return;
    try {
      const ctx = this.ctx;
      let t = ctx.currentTime + 0.005;
      for (let i = 0; i + 1 < notes.length; i += 2) {
        const f = notes[i], dur = notes[i + 1] / 1000;
        if (f > 0) {
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.22, t + 0.009);
          g.gain.setValueAtTime(0.22, Math.max(t + 0.009, t + dur - 0.022));
          g.gain.linearRampToValueAtTime(0.0001, t + dur);
          g.connect(ctx.destination);
          const o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = f;
          const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2;
          const g2 = ctx.createGain(); g2.gain.value = 0.28;
          o1.connect(g); o2.connect(g2); g2.connect(g);
          o1.start(t); o2.start(t); o1.stop(t + dur + 0.01); o2.stop(t + dur + 0.01);
        }
        t += dur;
      }
    } catch (e) { /* stay silent */ }
  },
};

// ---------- state ----------
const canvas = document.getElementById("game");
const g = canvas.getContext("2d");

const rnd = Math.random;
const rndInt = n => Math.floor(rnd() * n);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const same = (a, b) => a.x === b.x && a.y === b.y;

function newPlayer(id, accent, hue, span) {
  return { id, accent, hue, span, snake: [], prev: [], queue: [], dx: 1, dy: 0, score: 0, displayScore: 0,
           combo: 0, comboTimer: 0, shield: false, alive: false };
}
const players = [newPlayer(1, CYAN, 0.45, 0.18), newPlayer(2, ORANGE, 0.12, -0.10)];

let state = "MENU"; // MENU | PLAYING | PAUSED | GAME_OVER
let obstacles = [], particles = [], texts = [];
let food = { x: 0, y: 0 }, bonus = null;
let twoPlayer = false, wrap = false, diff = DIFFS[1], menuSel = 0;
let foodsEaten = 0, level = 1, slowTimer = 0, best = 0, newBest = false, winner = 0;
let moveAcc = 0, time = 0, shake = 0;

const stars = Array.from({ length: 80 }, () => ({ x: rnd() * W, y: rnd() * H, s: 0.5 + rnd() * 2, p: rnd() * 6.28 }));

// ---------- high scores (localStorage) ----------
const scoreKey = () => "voltviper_" + diff.name + "_" + (wrap ? "WRAP" : "SOLID");
function refreshBest() { try { best = parseInt(localStorage.getItem(scoreKey()) || "0", 10) || 0; } catch (e) { best = 0; } }
function saveBest() { try { localStorage.setItem(scoreKey(), String(best)); } catch (e) {} }
refreshBest();

// ---------- input ----------
const activePlayers = () => (twoPlayer ? 2 : 1);

function queueDir(pi, ndx, ndy) {
  if (state !== "PLAYING" || pi >= activePlayers()) return;
  const p = players[pi];
  if (!p.alive) return;
  const last = p.queue.length ? p.queue[p.queue.length - 1] : null;
  const cx = last ? last[0] : p.dx, cy = last ? last[1] : p.dy;
  if (cx === -ndx && cy === -ndy) return; // no reversing
  if (cx === ndx && cy === ndy) return;
  if (p.queue.length < 2) p.queue.push([ndx, ndy]);
}

function togglePause() {
  if (state === "PLAYING") state = "PAUSED";
  else if (state === "PAUSED") state = "PLAYING";
}

function handleKey(code, repeat) {
  if (state === "MENU") return menuKey(code, repeat);
  const arrows = twoPlayer ? 1 : 0;
  switch (code) {
    case "KeyW": queueDir(0, 0, -1); break;
    case "KeyS": queueDir(0, 0, 1); break;
    case "KeyA": queueDir(0, -1, 0); break;
    case "KeyD": queueDir(0, 1, 0); break;
    case "ArrowUp": queueDir(arrows, 0, -1); break;
    case "ArrowDown": queueDir(arrows, 0, 1); break;
    case "ArrowLeft": queueDir(arrows, -1, 0); break;
    case "ArrowRight": queueDir(arrows, 1, 0); break;
    case "Space": case "Enter":
      if (repeat) break;
      if (state === "GAME_OVER") startGame(); else togglePause();
      break;
    case "KeyP": if (!repeat) togglePause(); break;
    case "KeyM": if (!repeat) Sound.enabled = !Sound.enabled; break;
    case "Escape": if (!repeat) { state = "MENU"; refreshBest(); } break;
  }
}

function menuKey(code, repeat) {
  switch (code) {
    case "ArrowUp": case "KeyW": menuSel = (menuSel + 2) % 3; Sound.play(600, 25); break;
    case "ArrowDown": case "KeyS": menuSel = (menuSel + 1) % 3; Sound.play(600, 25); break;
    case "ArrowLeft": case "KeyA": changeOption(-1); break;
    case "ArrowRight": case "KeyD": changeOption(1); break;
    case "Space": case "Enter": if (!repeat) startGame(); break;
    case "KeyM": if (!repeat) Sound.enabled = !Sound.enabled; break;
  }
}

function changeOption(dir) {
  if (menuSel === 0) twoPlayer = !twoPlayer;
  else if (menuSel === 1) wrap = !wrap;
  else diff = DIFFS[(DIFFS.indexOf(diff) + dir + DIFFS.length) % DIFFS.length];
  refreshBest();
  Sound.play(760, 30, 900, 30);
}

const KEYS = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter", "Escape",
                      "KeyW", "KeyA", "KeyS", "KeyD", "KeyP", "KeyM"]);
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!KEYS.has(e.code)) return;
  e.preventDefault();
  Sound.unlock();
  handleKey(e.code, e.repeat);
});
window.addEventListener("blur", () => { if (state === "PLAYING") state = "PAUSED"; });

// touch / mouse: swipe to steer, tap to start / select
let touch = null;
canvas.addEventListener("pointerdown", e => {
  Sound.unlock();
  canvas.focus({ preventScroll: true });
  touch = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointerup", e => {
  if (!touch) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  touch = null;
  if (Math.hypot(dx, dy) > 24) {
    if (Math.abs(dx) > Math.abs(dy)) queueDir(0, dx > 0 ? 1 : -1, 0);
    else queueDir(0, 0, dy > 0 ? 1 : -1);
    return;
  }
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * W / r.width, py = (e.clientY - r.top) * H / r.height;
  if (state === "MENU") {
    for (let i = 0; i < 3; i++) {
      const y = HUD + 190 + i * 46;
      if (py >= y - 28 && py <= y + 12 && px > W / 2 - 250 && px < W / 2 + 250) {
        menuSel = i; changeOption(1); return;
      }
    }
    startGame();
  } else if (state === "GAME_OVER") startGame();
  else if (state === "PAUSED") state = "PLAYING";
  else if (state === "PLAYING" && py < HUD) state = "PAUSED";
});
canvas.addEventListener("pointercancel", () => { touch = null; });

// ---------- game flow ----------
function startGame() {
  for (const p of players) {
    p.snake = []; p.prev = []; p.queue = []; p.score = 0; p.displayScore = 0;
    p.combo = 0; p.comboTimer = 0; p.shield = false; p.alive = false;
  }
  if (twoPlayer) {
    setupPlayer(players[0], 6, ROWS / 2 - 3, 1);
    setupPlayer(players[1], COLS - 7, ROWS / 2 + 3, -1);
  } else {
    setupPlayer(players[0], COLS / 2, ROWS / 2, 1);
  }
  obstacles = []; particles = []; texts = [];
  foodsEaten = 0; level = 1; slowTimer = 0; bonus = null; newBest = false; winner = 0;
  moveAcc = 0; shake = 0;
  refreshBest();
  spawnFood();
  state = "PLAYING";
  Sound.play(392, 70, 523, 70, 659, 110);
}

function setupPlayer(p, hx, hy, dir) {
  p.dx = dir; p.dy = 0; p.alive = true;
  p.snake.push({ x: hx, y: hy }, { x: hx - dir, y: hy }, { x: hx - 2 * dir, y: hy });
  p.prev = p.snake.map(s => ({ ...s }));
}

function currentInterval() {
  const base = Math.max(diff.min, diff.base - (level - 1) * diff.step);
  return slowTimer > 0 ? base * 1.7 : base;
}

function isFree(x, y) {
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
  const p = { x, y };
  if (obstacles.some(o => same(o, p))) return false;
  for (let i = 0; i < activePlayers(); i++) if (players[i].snake.some(s => same(s, p))) return false;
  if (food && same(food, p)) return false;
  return !bonus || !same(bonus.p, p);
}

function spawnFood() {
  food = null;
  for (let tries = 0; tries < 1000; tries++) {
    const x = rndInt(COLS), y = rndInt(ROWS);
    if (isFree(x, y)) { food = { x, y }; return; }
  }
  food = { x: 0, y: 0 };
}

function maybeSpawnBonus() {
  if (bonus || rnd() > 0.28) return;
  for (let tries = 0; tries < 200; tries++) {
    const x = rndInt(COLS), y = rndInt(ROWS);
    if (isFree(x, y)) {
      const r = rnd();
      bonus = { p: { x, y }, type: r < 0.45 ? "GOLD" : r < 0.75 ? "SLOW" : "SHIELD", life: 8, max: 8 };
      Sound.play(880, 40, 1175, 60);
      return;
    }
  }
}

function addObstacles(count) {
  let placed = 0;
  for (let attempts = 0; attempts < 500 && placed < count; attempts++) {
    const x = 1 + rndInt(COLS - 2), y = 1 + rndInt(ROWS - 2);
    const len = 1 + rndInt(3), horiz = rnd() < 0.5;
    const blocks = [];
    let ok = true;
    for (let i = 0; i < len && ok; i++) {
      const bx = x + (horiz ? i : 0), by = y + (horiz ? 0 : i);
      if (!isFree(bx, by)) { ok = false; break; }
      for (let k = 0; k < activePlayers(); k++) { // safe zone around every head
        if (!players[k].alive) continue;
        const h = players[k].snake[0];
        if (Math.abs(bx - h.x) + Math.abs(by - h.y) < 6) ok = false;
      }
      blocks.push({ x: bx, y: by });
    }
    if (ok) { obstacles.push(...blocks); placed += blocks.length; }
  }
}

function step() {
  const n = activePlayers();

  for (let i = 0; i < n; i++) { // read queued input
    const p = players[i];
    if (p.alive && p.queue.length) { const d = p.queue.shift(); p.dx = d[0]; p.dy = d[1]; }
  }

  // 1) where does every head want to go
  const nx = new Array(n).fill(0), ny = new Array(n).fill(0);
  const ate = new Array(n).fill(false), wallHit = new Array(n).fill(false), dead = new Array(n).fill(false);
  for (let i = 0; i < n; i++) {
    const p = players[i];
    if (!p.alive) continue;
    const h = p.snake[0];
    nx[i] = h.x + p.dx; ny[i] = h.y + p.dy;
    if (nx[i] < 0 || nx[i] >= COLS || ny[i] < 0 || ny[i] >= ROWS) {
      if (wrap) { nx[i] = (nx[i] + COLS) % COLS; ny[i] = (ny[i] + ROWS) % ROWS; }
      else wallHit[i] = true;
    }
    ate[i] = !wallHit[i] && food.x === nx[i] && food.y === ny[i];
  }

  // 2) collisions
  for (let i = 0; i < n; i++) {
    const p = players[i];
    if (!p.alive) continue;
    let hit = wallHit[i], hitObs = false;
    const np = { x: nx[i], y: ny[i] };
    if (!wallHit[i]) {
      if (obstacles.some(o => same(o, np))) { hit = true; hitObs = true; }
      const limit = ate[i] ? p.snake.length : p.snake.length - 1;
      for (let k = 0; k < limit; k++) if (same(p.snake[k], np)) hit = true;
      for (let j = 0; j < n; j++) {
        if (j === i || !players[j].alive) continue;
        const o = players[j];
        const oLimit = ate[j] ? o.snake.length : o.snake.length - 1;
        for (let k = 0; k < oLimit; k++) if (same(o.snake[k], np)) hit = true;
        if (!wallHit[j] && nx[j] === nx[i] && ny[j] === ny[i]) hit = true; // head-on
      }
    }

    if (hit && p.shield) {
      p.shield = false;
      const px = (p.snake[0].x + 0.5) * TILE, py = (p.snake[0].y + 0.5) * TILE;
      burst(px, py, PURPLE, 40, 260);
      addText(px, py, "SHIELD BROKEN", PURPLE);
      Sound.play(300, 60, 200, 100);
      shake = Math.max(shake, 0.5);
      if (wallHit[i]) {
        nx[i] = (nx[i] + COLS) % COLS; ny[i] = (ny[i] + ROWS) % ROWS; wallHit[i] = false;
      }
      if (hitObs) obstacles = obstacles.filter(o => !(o.x === nx[i] && o.y === ny[i]));
      ate[i] = food.x === nx[i] && food.y === ny[i];
    } else if (hit) {
      dead[i] = true;
    }
  }

  // 3) move everyone who survived
  let anyDead = false;
  for (let i = 0; i < n; i++) {
    const p = players[i];
    if (!p.alive) continue;
    if (dead[i]) { anyDead = true; continue; }
    p.prev = p.snake.map(s => ({ ...s }));
    p.snake.unshift({ x: nx[i], y: ny[i] });
    if (ate[i]) eatFood(p, nx[i], ny[i]); else p.snake.pop();
    if (bonus && bonus.p.x === nx[i] && bonus.p.y === ny[i]) collectBonus(p);
  }

  if (anyDead) {
    for (let i = 0; i < n; i++) if (dead[i]) players[i].alive = false;
    endGame();
  }
}

function eatFood(p, x, y) {
  foodsEaten++;
  p.combo = p.comboTimer > 0 ? Math.min(5, p.combo + 1) : 1;
  p.comboTimer = 3.0;
  const pts = 10 * p.combo;
  p.score += pts;
  const px = (x + 0.5) * TILE, py = (y + 0.5) * TILE;
  burst(px, py, RED, 22, 200);
  addText(px, py - 10, "+" + pts + (p.combo > 1 ? "  x" + p.combo : ""), p.combo > 1 ? (twoPlayer ? p.accent : MAGENTA) : WHITE);
  Sound.play(520 + p.combo * 60, 45, 780 + p.combo * 80, 70);
  checkBest(p);

  if (foodsEaten % 5 === 0) {
    level++;
    addText(FIELD_W / 2, FIELD_H / 2, "LEVEL " + level, CYAN);
    burst(FIELD_W / 2, FIELD_H / 2, CYAN, 60, 320);
    const base = Math.min(4, 2 + Math.floor(level / 2));
    addObstacles(Math.max(1, Math.round(base * diff.obstacleFactor)));
    Sound.play(523, 70, 659, 70, 784, 70, 1047, 150);
  }
  spawnFood();
  maybeSpawnBonus();
}

function checkBest(p) {
  if (!twoPlayer && p.score > best) { best = p.score; newBest = true; }
}

function collectBonus(p) {
  const px = (bonus.p.x + 0.5) * TILE, py = (bonus.p.y + 0.5) * TILE;
  if (bonus.type === "GOLD") {
    const pts = 50 * Math.max(1, p.combo);
    p.score += pts; checkBest(p);
    burst(px, py, GOLD, 40, 280); addText(px, py, "+" + pts + " GOLD!", GOLD);
    Sound.play(988, 50, 1319, 50, 1568, 120);
  } else if (bonus.type === "SLOW") {
    slowTimer = 6.0;
    burst(px, py, BLUE, 40, 240); addText(px, py, "SLOW-MO", BLUE);
    Sound.play(660, 80, 440, 140);
  } else {
    p.shield = true;
    burst(px, py, PURPLE, 40, 240); addText(px, py, "SHIELD UP", PURPLE);
    Sound.play(440, 60, 554, 60, 659, 120);
  }
  bonus = null;
}

function endGame() {
  state = "GAME_OVER";
  shake = 1.0;
  for (let i = 0; i < activePlayers(); i++) {
    const p = players[i];
    if (p.alive) continue;
    for (const pt of p.snake) burst((pt.x + 0.5) * TILE, (pt.y + 0.5) * TILE, p.accent, 4, 220);
  }
  Sound.play(330, 120, 262, 120, 196, 120, 130, 300);

  if (twoPlayer) {
    const a1 = players[0].alive, a2 = players[1].alive;
    if (a1 && !a2) winner = 1;
    else if (a2 && !a1) winner = 2;
    else if (players[0].score > players[1].score) winner = 1;
    else if (players[1].score > players[0].score) winner = 2;
    else winner = 0;
  } else if (newBest) {
    saveBest();
  }
}

// ---------- fx ----------
function burst(x, y, c, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, v = speed * (0.25 + rnd() * 0.75);
    const life = 0.4 + rnd() * 0.6;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, size: 2 + rnd() * 4, c });
  }
}
function addText(x, y, s, c) { texts.push({ x, y, s, c, life: 1.2 }); }

// ---------- update ----------
function update(dt) {
  time += dt;

  for (const s of stars) {
    s.y += s.s * 12 * dt;
    if (s.y > H) { s.y = 0; s.x = rnd() * W; }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = Math.pow(0.96, dt * 66.7); // Java ran at ~66 fps
    p.vx *= damp; p.vy *= damp;
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt; t.y -= 30 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }

  shake = Math.max(0, shake - dt * 2.2);
  for (const p of players) {
    if (p.displayScore < p.score) p.displayScore = Math.min(p.score, p.displayScore + Math.max(1, Math.floor((p.score - p.displayScore) / 6)));
  }

  if (state !== "PLAYING") return;

  for (let i = 0; i < activePlayers(); i++) {
    const p = players[i];
    if (p.comboTimer > 0) { p.comboTimer -= dt; if (p.comboTimer <= 0) p.combo = 0; }
  }
  if (slowTimer > 0) slowTimer = Math.max(0, slowTimer - dt);
  if (bonus) { bonus.life -= dt; if (bonus.life <= 0) bonus = null; }

  const interval = currentInterval();
  moveAcc += dt;
  while (moveAcc >= interval && state === "PLAYING") { moveAcc -= interval; step(); }

  if (state === "PLAYING") { // sparkle trail behind each tail
    for (let i = 0; i < activePlayers(); i++) {
      const pl = players[i];
      if (!pl.alive || !pl.snake.length || rnd() > 0.35 * dt * 66.7) continue;
      const tail = pl.snake[pl.snake.length - 1];
      particles.push({ x: (tail.x + 0.5) * TILE + gauss() * 4, y: (tail.y + 0.5) * TILE + gauss() * 4,
        vx: gauss() * 12, vy: gauss() * 12, life: 0.5, max: 0.5, size: 2, c: pl.shield ? PURPLE : pl.accent });
    }
  }
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function circle(cx, cy, r) { g.beginPath(); g.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2); }
function glow(cx, cy, r, c, alpha) {
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0, A(c, alpha)); gr.addColorStop(1, A(c, 0));
  g.fillStyle = gr; circle(cx, cy, r); g.fill();
}
function centered(text, y) {
  g.textAlign = "center"; g.fillText(text, W / 2, y); g.textAlign = "left";
}
function neonText(text, fnt, y, c) {
  g.font = fnt; g.textAlign = "left";
  const x = (W - g.measureText(text).width) / 2;
  for (let i = 6; i >= 1; i--) {
    g.fillStyle = A(c, 18);
    for (let ox = -i; ox <= i; ox += i) for (let oy = -i; oy <= i; oy += i) g.fillText(text, x + ox, y + oy);
  }
  g.fillStyle = rgb(c); g.fillText(text, x, y);
  g.fillStyle = A(WHITE, 90); g.fillText(text, x, y - 1);
}

// ---------- render ----------
function render() {
  g.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  g.textBaseline = "alphabetic"; g.textAlign = "left"; g.lineCap = "butt"; g.lineJoin = "miter";
  drawBackground();

  g.save();
  g.translate((rnd() - 0.5) * shake * 14, HUD + (rnd() - 0.5) * shake * 14);
  drawField();
  g.restore();

  drawHud();

  if (state === "MENU") drawMenu();
  else if (state === "PAUSED") drawOverlay("PAUSED", CYAN, "Press SPACE to resume", null);
  else if (state === "GAME_OVER") {
    if (twoPlayer) {
      drawOverlay(winner === 0 ? "DRAW" : "PLAYER " + winner + " WINS", winner === 0 ? WHITE : players[winner - 1].accent,
        "P1  " + players[0].score + "     P2  " + players[1].score, "SPACE = rematch   -   ESC = menu");
    } else {
      drawOverlay("GAME OVER", RED, "Score " + players[0].score + (newBest ? "   -   NEW BEST!" : "   -   Best " + best),
        "SPACE = play again   -   ESC = menu");
    }
  }
}

function drawBackground() {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "rgb(8,10,26)"); gr.addColorStop(1, "rgb(28,10,44)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) {
    g.fillStyle = A([200, 220, 255], 70 + 90 * (0.5 + 0.5 * Math.sin(time * 1.5 + s.p)));
    const r = s.s * 0.9;
    g.beginPath(); g.ellipse(s.x + r / 2, s.y + r / 2, r / 2, r / 2, 0, 0, Math.PI * 2); g.fill();
  }
}

function drawField() {
  g.fillStyle = "rgba(6,8,18,0.78)"; g.fillRect(0, 0, FIELD_W, FIELD_H);

  g.strokeStyle = A([90, 130, 200], 22 + 12 * Math.sin(time * 2)); g.lineWidth = 1;
  g.beginPath();
  for (let i = 0; i <= COLS; i++) { g.moveTo(i * TILE + 0.5, 0); g.lineTo(i * TILE + 0.5, FIELD_H); }
  for (let i = 0; i <= ROWS; i++) { g.moveTo(0, i * TILE + 0.5); g.lineTo(FIELD_W, i * TILE + 0.5); }
  g.stroke();

  if (state !== "MENU") {
    for (const o of obstacles) {
      const x = o.x * TILE, y = o.y * TILE;
      glow(x + TILE / 2, y + TILE / 2, TILE * 0.9, MAGENTA, 50);
      rr(x + 2, y + 2, TILE - 4, TILE - 4, 4);
      g.fillStyle = "rgb(40,22,60)"; g.fill();
      g.strokeStyle = A(MAGENTA, 190); g.lineWidth = 2; g.stroke();
    }

    if (food) {
      const cx = (food.x + 0.5) * TILE, cy = (food.y + 0.5) * TILE;
      const pulse = 1 + 0.12 * Math.sin(time * 6);
      glow(cx, cy, TILE * 1.3 * pulse, RED, 130);
      const r = TILE * 0.32 * pulse;
      const gr = g.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx - r * 0.3, cy - r * 0.3, r * 1.4);
      gr.addColorStop(0, "rgb(255,190,200)"); gr.addColorStop(1, rgb(RED));
      g.fillStyle = gr; circle(cx, cy, r); g.fill();
    }

    if (bonus) drawBonus();
    for (let i = 0; i < activePlayers(); i++) if (players[i].snake.length) drawSnake(players[i]);
  }

  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    g.fillStyle = A(p.c, a * 255);
    const s = p.size * (0.4 + 0.6 * a);
    circle(p.x, p.y, s / 2); g.fill();
  }

  g.font = font(17, true);
  for (const t of texts) {
    const a = Math.max(0, Math.min(1, t.life / 0.6));
    const tx = t.x - g.measureText(t.s).width / 2;
    g.fillStyle = "rgba(0,0,0," + (a * 160 / 255).toFixed(3) + ")"; g.fillText(t.s, tx + 2, t.y + 2);
    g.fillStyle = A(t.c, a * 255); g.fillText(t.s, tx, t.y);
  }

  // neon border: solid for deadly walls, dashed for wrap-around
  const bc = wrap ? BLUE : CYAN;
  g.lineWidth = 9; g.strokeStyle = A(bc, 28); g.strokeRect(0, 0, FIELD_W, FIELD_H);
  g.lineWidth = 2;
  if (wrap) { g.setLineDash([10, 8]); g.lineDashOffset = -time * 20; }
  g.strokeStyle = A(bc, 170); g.strokeRect(0, 0, FIELD_W, FIELD_H);
  g.setLineDash([]); g.lineDashOffset = 0;
}

function segPos(pl, i, t) {
  const c = pl.snake[i];
  const p = pl.prev.length ? pl.prev[Math.min(i, pl.prev.length - 1)] : c;
  let px = p.x, py = p.y;
  if (Math.abs(c.x - p.x) > 1 || Math.abs(c.y - p.y) > 1) { px = c.x; py = c.y; } // wrapped: no sliding across
  return { x: (px + (c.x - px) * t) * TILE + TILE / 2, y: (py + (c.y - py) * t) * TILE + TILE / 2 };
}

function drawSnake(pl) {
  let t = state === "PLAYING" || state === "PAUSED" ? Math.min(1, moveAcc / currentInterval()) : 1;
  t = t * t * (3 - 2 * t);
  const dead = !pl.alive, n = pl.snake.length;

  for (let i = n - 1; i >= 0; i--) {
    const p = segPos(pl, i, t);
    const frac = n <= 1 ? 0 : i / (n - 1);
    let c = dead ? [110, 120, 130] : hsb(pl.hue + pl.span * frac, 0.85, 1);
    if (slowTimer > 0 && !dead) c = hsb(0.58 + 0.08 * frac, 0.75, 1);

    glow(p.x, p.y, TILE * 0.95, pl.shield && !dead ? PURPLE : c, i === 0 ? 90 : 45);

    const size = TILE - 3 - 6 * frac;
    const gr = g.createLinearGradient(p.x - size / 2, p.y - size / 2, p.x + size / 2, p.y + size / 2);
    gr.addColorStop(0, rgb(brighter(c))); gr.addColorStop(1, rgb(darker(c)));
    rr(p.x - size / 2, p.y - size / 2, size, size, size * 0.275);
    g.fillStyle = gr; g.fill();
    if (pl.shield && !dead) { g.strokeStyle = A(PURPLE, 200); g.lineWidth = 2; g.stroke(); }
  }

  const h = segPos(pl, 0, t), dx = pl.dx, dy = pl.dy, f = 5, s = 5;
  const e1x = h.x + dx * f - dy * s, e1y = h.y + dy * f + dx * s;
  const e2x = h.x + dx * f + dy * s, e2y = h.y + dy * f - dx * s;
  g.fillStyle = "#fff";
  circle(e1x, e1y, 3.4); g.fill(); circle(e2x, e2y, 3.4); g.fill();
  g.fillStyle = dead ? "rgb(200,40,40)" : "rgb(10,10,30)";
  circle(e1x + dx * 1.2, e1y + dy * 1.2, 1.6); g.fill(); circle(e2x + dx * 1.2, e2y + dy * 1.2, 1.6); g.fill();

  if (twoPlayer && !dead) {
    g.font = font(11, true); g.fillStyle = rgb(pl.accent);
    const tag = "P" + pl.id;
    g.fillText(tag, h.x - g.measureText(tag).width / 2, h.y - TILE * 0.7);
  }
}

function drawBonus() {
  const cx = (bonus.p.x + 0.5) * TILE;
  let cy = (bonus.p.y + 0.5) * TILE;
  const c = bonus.type === "GOLD" ? GOLD : bonus.type === "SLOW" ? BLUE : PURPLE;
  cy += Math.sin(time * 5) * 1.5;

  glow(cx, cy, TILE * 1.4, c, 140);

  g.lineWidth = 2.5; g.strokeStyle = A(c, 200); // countdown ring
  g.beginPath(); g.arc(cx, cy, TILE * 0.5, -Math.PI / 2, -Math.PI / 2 - Math.PI * 2 * (bonus.life / bonus.max), true); g.stroke();

  const r = TILE * 0.28;
  g.beginPath();
  if (bonus.type === "GOLD") {
    g.moveTo(cx, cy - r * 1.3); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r * 1.3); g.lineTo(cx - r, cy); g.closePath();
  } else if (bonus.type === "SLOW") {
    g.arc(cx, cy, r, 0, Math.PI * 2);
  } else {
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 3 * i - Math.PI / 2;
      const px = cx + Math.cos(a) * r * 1.2, py = cy + Math.sin(a) * r * 1.2;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
  }
  g.fillStyle = rgb(c); g.fill();
  g.strokeStyle = A(WHITE, 200); g.lineWidth = 1.2; g.stroke();
}

function stat(label, value, x, c, shield) {
  g.font = font(11, true); g.fillStyle = "rgb(150,160,190)"; g.fillText(label, x, 22);
  if (shield) { g.fillStyle = rgb(PURPLE); g.fillText("SHIELD", x + g.measureText(label).width + 8, 22); }
  g.font = font(28, true); g.fillStyle = rgb(c); g.fillText(value, x, 52);
}

function drawHud() {
  g.fillStyle = "rgba(10,12,30,0.9)"; g.fillRect(0, 0, W, HUD);
  g.fillStyle = A(CYAN, 90); g.fillRect(0, HUD - 2, W, 2);

  const p1 = players[0], p2 = players[1];
  const dim = "rgb(90,95,120)";

  if (!twoPlayer) {
    stat("SCORE", String(p1.displayScore), 22, WHITE, p1.shield);
    stat("LEVEL", String(level), 210, CYAN, false);
    stat("BEST", String(best), 330, GOLD, false);
    const cx = 470;
    g.font = font(11, true); g.fillStyle = "rgb(150,160,190)"; g.fillText("COMBO", cx, 22);
    g.font = font(28, true);
    if (p1.combo > 1) {
      g.fillStyle = rgb(MAGENTA); g.fillText("x" + p1.combo, cx, 52);
      g.fillStyle = A(MAGENTA, 120);
      rr(cx + 54, 40, Math.max(0, 50 * Math.max(0, p1.comboTimer) / 3), 8, 4); g.fill();
    } else { g.fillStyle = dim; g.fillText("-", cx, 52); }
  } else {
    stat("P1 SCORE", String(p1.displayScore), 22, CYAN, p1.shield);
    stat("P2 SCORE", String(p2.displayScore), 190, ORANGE, p2.shield);
    stat("LEVEL", String(level), 360, WHITE, false);
    g.font = font(11, true); g.fillStyle = "rgb(150,160,190)"; g.fillText("COMBO", 470, 22);
    g.font = font(22, true);
    g.fillStyle = p1.combo > 1 ? rgb(CYAN) : dim; g.fillText(p1.combo > 1 ? "x" + p1.combo : "-", 470, 50);
    g.fillStyle = p2.combo > 1 ? rgb(ORANGE) : dim; g.fillText(p2.combo > 1 ? "x" + p2.combo : "-", 520, 50);
  }

  const ex = 600;
  g.font = font(11, true); g.fillStyle = "rgb(150,160,190)"; g.fillText("EFFECTS", ex, 22);
  g.font = font(13, true);
  if (slowTimer > 0) {
    g.fillStyle = rgb(BLUE); g.fillText("SLOW", ex, 44);
    rr(ex + 38, 35, Math.max(0, 30 * slowTimer / 6), 8, 3); g.fill();
  } else { g.fillStyle = dim; g.fillText("none", ex, 44); }

  g.font = font(10, false); g.fillStyle = "rgb(120,130,160)";
  const mode = diff.name + " - " + (wrap ? "WRAP" : "SOLID");
  g.fillText(mode, W - 10 - g.measureText(mode).width, 14);
  g.font = font(11, false);
  const snd = Sound.enabled ? "[M] sound on" : "[M] sound off";
  g.fillText(snd, W - 10 - g.measureText(snd).width, 56);
}

function drawMenu() {
  g.fillStyle = "rgba(4,6,16,0.78)"; g.fillRect(0, HUD, W, FIELD_H);

  for (let i = 0; i < 26; i++) { // decorative sine snake
    const x = W / 2 - 260 + i * 20, y = HUD + 400 + Math.sin(time * 3 - i * 0.45) * 20;
    const c = hsb(0.45 + 0.18 * (i / 26), 0.85, 1);
    glow(x, y, 20, c, 90);
    g.fillStyle = rgb(c); circle(x, y, 9 - i * 0.12); g.fill();
  }

  neonText("VOLT VIPER", font(68, true), HUD + 105, CYAN);

  const labels = ["MODE", "WALLS", "DIFFICULTY"];
  const values = [twoPlayer ? "2 PLAYERS" : "1 PLAYER", wrap ? "WRAP AROUND" : "SOLID", diff.name];
  const valueColors = [twoPlayer ? ORANGE : CYAN, wrap ? BLUE : CYAN,
    diff === DIFFS[0] ? [110, 230, 140] : diff === DIFFS[1] ? GOLD : RED];
  for (let i = 0; i < 3; i++) {
    const y = HUD + 190 + i * 46, sel = i === menuSel;
    if (sel) {
      rr(W / 2 - 250, y - 28, 500, 40, 8); g.fillStyle = A(CYAN, 26); g.fill();
      g.strokeStyle = A(CYAN, 140); g.lineWidth = 1.5; g.stroke();
    }
    g.font = font(16, true); g.fillStyle = sel ? "#fff" : "rgb(150,160,190)"; g.fillText(labels[i], W / 2 - 225, y);
    g.font = font(20, true); g.fillStyle = rgb(valueColors[i]);
    const v = sel ? "<   " + values[i] + "   >" : values[i];
    g.fillText(v, W / 2 + 90 - g.measureText(v).width / 2, y);
  }

  g.font = font(13, false); g.fillStyle = "rgb(130,140,170)";
  centered("UP / DOWN select    LEFT / RIGHT change", HUD + 335);
  if (!twoPlayer) { g.fillStyle = rgb(GOLD); centered("Best (" + diff.name + ", " + (wrap ? "WRAP" : "SOLID") + "):  " + best, HUD + 358); }
  else { g.fillStyle = rgb(ORANGE); centered("Last snake alive wins!", HUD + 358); }

  const a = 0.5 + 0.5 * Math.sin(time * 4);
  g.font = font(22, true); g.fillStyle = A(WHITE, 110 + 145 * a);
  centered("Press SPACE to start", HUD + FIELD_H - 100);

  g.font = font(14, false); g.fillStyle = "rgb(170,180,210)";
  centered(twoPlayer ? "P1: WASD     P2: Arrow keys     -     P pause     M mute"
                     : "Arrow keys / WASD to steer     -     P pause     M mute", HUD + FIELD_H - 68);
  g.fillStyle = rgb(GOLD); centered("Gold = bonus points", HUD + FIELD_H - 44);
  g.fillStyle = rgb(BLUE); centered("Blue = slow-mo", HUD + FIELD_H - 27);
  g.fillStyle = rgb(PURPLE); centered("Purple = shield (survive one crash)", HUD + FIELD_H - 10);
}

function drawOverlay(title, titleColor, sub, sub2) {
  g.fillStyle = "rgba(4,6,16,0.686)"; g.fillRect(0, HUD, W, FIELD_H);
  const cy = HUD + FIELD_H / 2;
  neonText(title, font(56, true), cy - 20, titleColor);
  g.font = font(20, true); g.fillStyle = "#fff"; centered(sub, cy + 25);
  if (sub2) {
    const a = 0.5 + 0.5 * Math.sin(time * 4);
    g.fillStyle = A(WHITE, 110 + 145 * a); g.font = font(16, false); centered(sub2, cy + 58);
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// crisp rendering on high-DPI screens
function fitCanvas() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
}
fitCanvas();
window.addEventListener("resize", fitCanvas);
canvas.focus({ preventScroll: true });
requestAnimationFrame(frame);

// tiny hook for automated tests
window.__vv = { get state() { return state; }, players, startGame, handleKey };
</script>
